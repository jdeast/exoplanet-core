[project]
name = "exoplanet_core"
description = "The compiled backend for exoplanet"
authors = [{ name = "Dan Foreman-Mackey", email = "foreman.mackey@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT License" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
dynamic = ["version"]
dependencies = ["numpy"]

[project.optional-dependencies]
pymc3 = ["pymc3>=3.9; python_version<'3.12'", "numpy<1.22; python_version<'3.12'"]
pymc = ["pymc>=5.0.0", "pytensor>=2.0"]
jax = ["jax>=0.5.0"]
test = ["pytest"]
comparison = ["batman-package; python_version<'3.12'", "starry; python_version<'3.12'", "numpy<1.22; python_version<'3.12'", "xarray<2023.10.0; python_version<'3.12'"]
benchmark = [
  "pytest",
  "pytest-benchmark",
  "radvel; python_version<'3.12'",
  "kepler.py",
  "batman-package; python_version<'3.12'",
  "starry; python_version<'3.12'",
  "exoplanet==0.4.5; python_version<'3.12'",
]

[project.urls]
"Homepage" = "https://docs.exoplanet.codes"
"Source" = "https://github.com/exoplanet-dev/exoplanet-core"
"Bug Tracker" = "https://github.com/exoplanet-dev/exoplanet-core/issues"

[build-system]
requires = ["scikit-build-core", "numpy", "pybind11"]
build-backend = "scikit_build_core.build"

[tool.uv]
# CI resolves fresh on every run (`uv run --extra ...`, no uv.lock), and uv's
# default prerelease policy is "if-necessary-or-explicit" -- it will reach for
# a pre-release when that is the only way to satisfy the constraints. That is
# how `test_pymc` started failing with
#
#     AttributeError: module 'numpy' has no attribute 'row_stack'
#
# numba/np/arrayobj.py calls overload(np.row_stack) at import, and numpy
# removed np.row_stack in 2.5.0. Every FINAL numba caps numpy against this
# (0.63.0 -> numpy<2.4, 0.66.0 -> numpy<2.5), but numba 0.63.0b1 declares only
# numpy>=1.22 -- the cap landed after that beta was published. Wanting the
# newest numpy and bounded by pytensor's numba<=0.66.0, the resolver cannot
# use numba 0.66.0 (it demands numpy<2.5) and picks the uncapped pre-release
# instead, pairing numba 0.63.0b1 with numpy 2.5.2.
#
# pip resolves the same requirements to numba 0.66.0 + numpy 2.4.6, which
# works, because pip excludes pre-releases by default. This makes uv agree.
#
# Note a numba<=0.66.0 pin would NOT have helped: 0.63.0b1 already satisfies
# it. The problem is the pre-release, not the ceiling.
prerelease = "disallow"

[tool.scikit-build]
sdist.exclude = []
sdist.include = ["src/exoplanet_core/exoplanet_core_version.py"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "src/exoplanet_core/exoplanet_core_version.py"

[tool.cibuildwheel]
skip = "pp* *-win32 *-musllinux_* *-manylinux_i686"

[tool.black]
line-length = 79

[tool.isort]
skip_glob = []
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
